name: SR Bot Commands (fast)

# Runs every minute — only processes Telegram commands, no market scan.
# This gives ~1 min response time to /status /price /trades etc.

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Share state with the main scan workflow
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bot-state-cmd-${{ github.run_id }}
          restore-keys: |
            bot-state-cmd-
            bot-state-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process commands
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_KEY:     ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID:  ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_DEMO:        ${{ vars.OANDA_DEMO || 'true' }}
          BINANCE_API_KEY:   ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET:    ${{ secrets.BINANCE_SECRET }}
          KUCOIN_API_KEY:    ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_SECRET:     ${{ secrets.KUCOIN_SECRET }}
          KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
        run: python bot.py --commands-only

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bot-state-cmd-${{ github.run_id }}
